<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>MIC</title>
  <style>
    :root {
      --bg: #faf7f2;
      --text: #1c1410;
      --muted: #6f625a;
      --line: #e6ddd2;
      --accent: #3b2418;
      --world: #1f6b4f;
      --danger: #a3322a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14100d;
        --text: #f3ece4;
        --muted: #b3a597;
        --line: #33291f;
        --accent: #c89a77;
        --world: #5fb48d;
        --danger: #e57a70;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 420px; }
    .logo { width: 72px; height: 72px; display: block; margin: 0 auto 8px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; text-align: center; margin: 0; }
    .tag { text-align: center; color: var(--muted); margin: 4px 0 28px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .help { color: var(--muted); font-size: 13px; margin: 8px 0 20px; }
    button {
      width: 100%;
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); margin-top: 10px; }
    button[disabled] { opacity: 0.6; }
    .error { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 0 0 10px; }
    .status { text-align: center; color: var(--muted); }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 12px;
      border: 3px solid var(--line); border-top-color: var(--world); border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
    details { margin-top: 24px; color: var(--muted); font-size: 13px; }
    summary { cursor: pointer; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 26c6-5 12-6 16-3 3 2 5 2 8 0 3-2 5-2 8 0 4-3 10-2 16 3-5 14-14 22-24 22S13 40 8 26z" stroke="currentColor" stroke-width="3.5" />
      <path d="M15 29c9 8 25 8 34 0" stroke="#1F6B4F" stroke-width="3" />
    </svg>
    <h1>MIC</h1>
    <p class="tag" data-t="tagline"></p>

    <section id="connecting" hidden>
      <div class="spinner"></div>
      <p class="status" id="connecting-text"></p>
      <button class="ghost" id="change" type="button" data-t="change"></button>
    </section>

    <form id="form" novalidate hidden>
      <label for="server" data-t="label"></label>
      <input id="server" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false"
        placeholder="http://192.168.1.10:37238" required />
      <p class="help" data-t="help"></p>
      <p class="error" id="error" role="alert"></p>
      <button id="connect" type="submit" data-t="connect"></button>
      <details>
        <summary data-t="whereTitle"></summary>
        <p data-t="wherePc"></p>
        <p data-t="whereWeb"></p>
      </details>
    </form>
  </main>

  <script>
    const STRINGS = {
      fr: {
        tagline: 'Monde Interconnecté',
        label: 'Adresse du serveur MIC',
        help: 'L’adresse est retenue : la prochaine fois, MIC s’ouvre directement.',
        connect: 'Se connecter',
        change: 'Changer de serveur',
        connecting: 'Connexion à {server}…',
        invalid: 'Adresse invalide. Exemple : http://192.168.1.10:37238',
        unreachable: 'Impossible de joindre {server}. Vérifiez l’adresse et que le téléphone est sur le même réseau Wi-Fi que le serveur.',
        whereTitle: 'Où trouver l’adresse ?',
        wherePc: 'Sur le PC : ouvrez l’application MIC pour Windows, menu « Android » → « Partager sur le réseau local ». L’adresse s’affiche (par exemple http://192.168.1.10:37238).',
        whereWeb: 'Sur un serveur en ligne : saisissez son adresse https://… Le micro et la caméra (vocaux, appels, Clips) ne fonctionnent qu’avec une adresse en https.',
      },
      en: {
        tagline: 'Interconnected World',
        label: 'MIC server address',
        help: 'The address is remembered: next time, MIC opens directly.',
        connect: 'Connect',
        change: 'Change server',
        connecting: 'Connecting to {server}…',
        invalid: 'Invalid address. Example: http://192.168.1.10:37238',
        unreachable: 'Can’t reach {server}. Check the address and that the phone is on the same Wi-Fi network as the server.',
        whereTitle: 'Where do I find the address?',
        wherePc: 'On the PC: open the MIC app for Windows, menu “Android” → “Share on local network”. The address is shown (for example http://192.168.1.10:37238).',
        whereWeb: 'On an online server: enter its https://… address. Microphone and camera (voice messages, calls, Clips) only work over https.',
      },
    };
    const lang = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    document.documentElement.lang = lang;
    const t = (key, vars = {}) => STRINGS[lang][key].replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);

    const KEY = 'mic.server';
    const $ = (id) => document.getElementById(id);
    const read = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
    const write = (v) => { try { localStorage.setItem(KEY, v); } catch { /* rien */ } };

    function normalize(raw) {
      let v = String(raw || '').trim();
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
      try {
        const u = new URL(v);
        if (!/^https?:$/.test(u.protocol) || !u.hostname) return null;
        return u.origin;
      } catch {
        return null;
      }
    }

    // Le serveur répond-il ? (requête « no-cors » : seule l'absence de réponse compte)
    async function reachable(origin) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        await fetch(origin + '/manifest.webmanifest', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    let cancelled = false;
    function showForm(message = '') {
      cancelled = true;
      $('connecting').hidden = true;
      $('form').hidden = false;
      $('error').textContent = message;
      $('connect').disabled = false;
      $('server').value = read() || '';
    }

    async function connect(origin, { auto = false } = {}) {
      cancelled = false;
      $('form').hidden = true;
      $('connecting').hidden = false;
      $('connecting-text').textContent = t('connecting', { server: origin });
      // Au démarrage automatique, on laisse un instant pour « Changer de serveur ».
      const [ok] = await Promise.all([reachable(origin), new Promise((r) => setTimeout(r, auto ? 1200 : 0))]);
      if (cancelled) return;
      if (!ok) return showForm(t('unreachable', { server: origin }));
      write(origin);
      location.replace(origin + '/');
    }

    $('change').addEventListener('click', () => showForm());
    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const origin = normalize($('server').value);
      if (!origin) {
        $('error').textContent = t('invalid');
        return;
      }
      connect(origin);
    });

    const saved = normalize(read());
    if (saved) connect(saved, { auto: true });
    else showForm();
  </script>
</body>
</html>
