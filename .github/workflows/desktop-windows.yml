# Construit l'application de bureau MIC pour Windows (.exe) et la publie
# dans les « Releases » du dépôt.
name: MIC pour Windows

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire le .exe
        run: npx electron-builder --win --x64 --publish never

      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MIC-Windows
          path: |
            dist/*.exe

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MIC ${{ steps.version.outputs.version }} pour Windows
          make_latest: true
          body: |
            **MIC — Monde Interconnecté**, application de bureau pour Windows (64 bits).

            - `MIC-Setup-${{ steps.version.outputs.version }}.exe` : installateur (raccourci sur le Bureau et dans le menu Démarrer).
            - `MIC-${{ steps.version.outputs.version }}-portable.exe` : version portable, se lance sans installation.

            Au premier lancement, des comptes de démonstration sont créés (par exemple +237 670000001 pour @angele) ;
            le code de vérification s'affiche à l'écran. Les données restent sur cet ordinateur.

            L'application n'est pas signée : Windows SmartScreen peut afficher « Windows a protégé votre ordinateur ».
            Cliquez sur « Informations complémentaires », puis « Exécuter quand même ».
          files: dist/*.exe
