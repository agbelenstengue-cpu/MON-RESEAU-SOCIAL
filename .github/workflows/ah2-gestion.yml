# AH2 Gestion : tests, puis fabrication de l'installateur Windows et de
# l'APK Android, publiés dans les « Releases » du dépôt.
name: AH2 Gestion

on:
  push:
    paths:
      - 'ah2-gestion/**'
      - '.github/workflows/ah2-gestion.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ah2-gestion
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ah2-gestion
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Construire l'application Windows
        run: flutter build windows --release
      - name: Lire la version
        id: version
        shell: bash
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//').${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Fabriquer l'installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=${{ steps.version.outputs.version }}" windows\installateur.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AH2-Gestion-Windows
          path: ah2-gestion/build/installateur/*.exe

  android:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ah2-gestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Clé de signature stable (secrets du dépôt)
        env:
          CLE_B64: ${{ secrets.AH2_ANDROID_CLE }}
          CLE_MDP: ${{ secrets.AH2_ANDROID_MDP }}
        run: |
          if [ -n "$CLE_B64" ] && [ -n "$CLE_MDP" ]; then
            echo "$CLE_B64" | base64 -d > android/app/ah2-signature.jks
            printf 'storeFile=ah2-signature.jks\nstorePassword=%s\nkeyAlias=ah2\nkeyPassword=%s\n' "$CLE_MDP" "$CLE_MDP" > android/app/signature.properties
            echo "APK signé avec la clé stable de la structure."
          else
            echo "::warning::Secrets AH2_ANDROID_CLE et AH2_ANDROID_MDP absents : APK signé avec une clé temporaire."
          fi
      - name: Construire l'APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Nommer l'APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//').${{ github.run_number }}
          mkdir -p build/sortie
          cp build/app/outputs/flutter-apk/app-release.apk "build/sortie/AH2-Gestion-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AH2-Gestion-Android
          path: ah2-gestion/build/sortie/*.apk

  publication:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version
        id: version
        run: |
          echo "version=$(grep '^version:' ah2-gestion/pubspec.yaml | sed 's/version: *//; s/+.*//').${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: AH2-Gestion-*
          path: sortie
          merge-multiple: true
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ah2-gestion-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AH2 Gestion ${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          files: sortie/*
          body: |
            **AH2 Gestion**, logiciel de gestion et de comptabilité d'A Hand to Humanity.

            ### PC central et autres PC (Windows 10 ou 11, 64 bits)
            - `AH2-Gestion-Setup-${{ steps.version.outputs.version }}.exe` : installateur. Une nouvelle version
              s'installe par-dessus l'ancienne, sans perte de données.
            - Le logiciel n'est pas signé : si Windows SmartScreen s'affiche, cliquez sur
              « Informations complémentaires », puis « Exécuter quand même ».

            ### Téléphones (Android 8 ou plus récent)
            - `AH2-Gestion-${{ steps.version.outputs.version }}.apk` : copiez-le sur le téléphone, ouvrez-le et
              autorisez l'installation depuis cette source.

            Installation pas à pas : `ah2-gestion/docs/guide-installation.md`.
